[project]
name = "grokbot-discord"
version = "0.1.0"
description = "Discord to Grok Bot bridge for private universal roaming Grok Bot control."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "discord.py==2.4.0",
    "aiohttp==3.10.10",
    "pyyaml==6.0.2",
    "audioop-lts==0.2.1; python_version>='3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
]

[project.scripts]
grokbot-discord = "grokbot_discord.bot:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
